name: apply-auditoria-patch
on:
  push:
    paths:
      - ".github/patches/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch, commit real files, clean up
        run: |
          set -euo pipefail
          P0=".github/patches/auditoria-2026-08-20.patch.0"
          P1=".github/patches/auditoria-2026-08-20.patch.1"
          P2=".github/patches/auditoria-2026-08-20.patch.2"
          P3=".github/patches/auditoria-2026-08-20.patch.3"
          missing=0
          for f in "$P0" "$P1" "$P2" "$P3"; do
            if [ ! -f "$f" ]; then echo "faltando $f"; missing=1; fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Ainda faltam pedaços do patch. Sai sem aplicar."
            exit 0
          fi
          cat "$P0" "$P1" "$P2" "$P3" > /tmp/auditoria.patch
          git apply --whitespace=nowarn /tmp/auditoria.patch
          rm -rf .github/patches
          rm -f .github/workflows/apply-auditoria-patch.yml
          git config user.name "VaidosaFashion"
          git config user.email "Vaidosa.financeiro@gmail.com"
          git add -A
          git status
          git commit -m "$(cat <<'EOF'
Corrige bugs reais da auditoria: Misto, estoque, data UTC, cor no caixa

SQL em supabase/migrations/20260820124800_fix_auditoria_bugs.sql —
colar no SQL Editor do Supabase (db push não funciona neste projeto).
EOF
)"
          git push
